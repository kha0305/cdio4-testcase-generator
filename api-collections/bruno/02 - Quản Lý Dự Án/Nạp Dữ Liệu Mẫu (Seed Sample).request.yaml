$kind: http-request
url: "{{base_url}}/api/projects/seed-sample"
method: POST
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Nap mau thanh cong', () => pm.expect(pm.response.code).to.be.oneOf([200,201]));
      var res = pm.response.json();
      if (res.project && res.project.id) {
          pm.collectionVariables.set('project_id', res.project.id.toString());
          console.log('Da nap du an mau, project_id:', res.project.id);
      }
    language: text/javascript
order: 5000
