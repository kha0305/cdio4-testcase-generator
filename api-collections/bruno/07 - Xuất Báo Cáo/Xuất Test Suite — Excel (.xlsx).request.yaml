$kind: http-request
url: "{{base_url}}/api/export/{{suite_id}}?format=xlsx"
method: GET
headers:
  Authorization: Bearer {{token}}
queryParams:
  format: xlsx
scripts:
  - type: afterResponse
    code: |-
      pm.test('Xuat file thanh cong (200)', () => pm.response.to.have.status(200));
      pm.test('Content-Type la Excel', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('spreadsheetml'));
    language: text/javascript
order: 1000
