$kind: http-request
url: "{{base_url}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "ab",
      "email": "khong-phai-email",
      "full_name": "x",
      "password": "123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Phai tra 422 Validation Error', () => pm.response.to.have.status(422));
      var res = pm.response.json();
      pm.test('Co thong tin loi', () => pm.expect(res.detail).to.be.an('array'));
    language: text/javascript
order: 2000
