$kind: http-request
url: "{{base_url}}/api/sprints"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "project_id": {{project_id}},
      "name": "Sprint 1 — Kiểm Thử Module Đăng Nhập",
      "goal": "Hoàn thiện 100% test case cho chức năng đăng nhập và đạt tỉ lệ Pass >= 90%",
      "start_date": "2026-10-01",
      "end_date": "2026-10-14",
      "status": "active"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Tao thanh cong', () => pm.expect(pm.response.code).to.be.oneOf([200,201]));
      var res = pm.response.json();
      if (res.id) pm.collectionVariables.set('sprint_id', res.id.toString());
    language: text/javascript
order: 2000
