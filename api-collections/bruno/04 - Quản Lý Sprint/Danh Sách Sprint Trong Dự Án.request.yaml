$kind: http-request
url: "{{base_url}}/api/sprints/project/{{project_id}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Thanh cong (200)', () => pm.response.to.have.status(200));
      var res = pm.response.json();
      if (res.length > 0) {
          pm.collectionVariables.set('sprint_id', res[0].id.toString());
          console.log('sprint_id da luu:', res[0].id);
      }
    language: text/javascript
order: 1000
