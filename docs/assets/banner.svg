<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0A0E17" />
    </linearGradient>

    <!-- Top Border Glow Gradient -->
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0" />
      <stop offset="25%" stop-color="#2563EB" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="75%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>

    <!-- Radial Glow Center -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />
  
  <!-- Subtle Grid Texture -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />
  
  <!-- Ambient Center Glow -->
  <circle cx="600" cy="190" r="380" fill="url(#centerGlow)" />

  <!-- Top Accent Glowing Border -->
  <rect x="100" y="0" width="1000" height="2" fill="url(#topGlow)" />

  <!-- Badge / Tagline Pill -->
  <g transform="translate(600, 58)">
    <rect x="-190" y="-15" width="380" height="30" rx="15" fill="rgba(37, 99, 235, 0.15)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <text text-anchor="middle" y="4" class="font-mono" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.5">
      CDIO-4 CAPSTONE PROJECT — KỸ THUẬT PHẦN MỀM
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" class="font-title" font-size="44" fill="url(#titleGrad)" letter-spacing="-0.5">
    CDIO-4 AUTOTEST STUDIO
  </text>

  <!-- Tagline Subtitle -->
  <text x="600" y="185" text-anchor="middle" class="font-sans" font-size="16" font-weight="400" fill="#94A3B8" letter-spacing="0.2">
    Hệ Thống Tự Động Sinh Test Case Chuẩn ISTQB CTFL v4.0 &amp; ISO/IEC/IEEE 29119-3
  </text>

  <!-- 4 Feature Pills -->
  <g transform="translate(600, 248)">
    <!-- Pill 1: BVA -->
    <g transform="translate(-405, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1" />
      <circle cx="-75" cy="0" r="4" fill="#38BDF8" />
      <text x="-60" y="5" class="font-sans" font-size="12" font-weight="600" fill="#E2E8F0">BVA (6 Điểm Biên)</text>
    </g>

    <!-- Pill 2: EP -->
    <g transform="translate(-135, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1" />
      <circle cx="-85" cy="0" r="4" fill="#818CF8" />
      <text x="-70" y="5" class="font-sans" font-size="12" font-weight="600" fill="#E2E8F0">Phân Vùng Tương Đương</text>
    </g>

    <!-- Pill 3: Pairwise -->
    <g transform="translate(135, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1" />
      <circle cx="-85" cy="0" r="4" fill="#34D399" />
      <text x="-70" y="5" class="font-sans" font-size="12" font-weight="600" fill="#E2E8F0">Pairwise Tổ Hợp Trực Giao</text>
    </g>

    <!-- Pill 4: Z3 Solver -->
    <g transform="translate(405, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1" />
      <circle cx="-85" cy="0" r="4" fill="#F472B6" />
      <text x="-70" y="5" class="font-sans" font-size="12" font-weight="600" fill="#E2E8F0">Microsoft Z3 SMT Solver</text>
    </g>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="80" y1="315" x2="1120" y2="315" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

  <!-- Bottom Badges / Metrics Row -->
  <g transform="translate(600, 362)">
    <!-- Metric 1 -->
    <g transform="translate(-360, 0)">
      <text text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#60A5FA">FastAPI + React 18</text>
      <text text-anchor="middle" y="18" class="font-sans" font-size="11" fill="#64748B">Monorepo Architecture</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(-120, 0)">
      <text text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#34D399">18 / 18 Steps (100% Pass)</text>
      <text text-anchor="middle" y="18" class="font-sans" font-size="11" fill="#64748B">Integration Test Suite</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(120, 0)">
      <text text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#FBBF24">Scrum &amp; DoD Metrics</text>
      <text text-anchor="middle" y="18" class="font-sans" font-size="11" fill="#64748B">Definition of Done Auto</text>
    </g>

    <!-- Metric 4 -->
    <g transform="translate(360, 0)">
      <text text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#A78BFA">Excel, CSV, JSON, Markdown</text>
      <text text-anchor="middle" y="18" class="font-sans" font-size="11" fill="#64748B">4-Format Export Engine</text>
    </g>
  </g>
</svg>
